<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moovo">
<title>Moovo 3D · Intérieur</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<style>
  :root{
    --bg:#eef0f3;--panel:#fff;--panel2:#f7f8fa;--ink:#1b1f27;--muted:#697386;--line:#e1e5eb;--line2:#cfd5de;
    --accent:#2563eb;--accent-ink:#fff;--accent-weak:#e9f0ff;--danger:#b42318;--warn:#9a5b00;--warn-bg:#fff6e5;--ok:#15803d;
    --aside:460px;--v3h:46%;--shadow:0 8px 30px #0f172a1f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
  .brand{display:flex;gap:7px;align-items:center;text-decoration:none;color:#1e2f4f;font-weight:800;font-size:16px;letter-spacing:-.01em}
  .brand img{width:26px;height:26px;display:block}
  .brand .o2{background:linear-gradient(135deg,#7c4ddb,#22c3e6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2563eb,#7c4ddb);border-radius:5px;padding:1px 5px;letter-spacing:.03em}
  .projname{font:inherit;font-weight:600;font-size:14px;border:1px solid transparent;border-radius:7px;padding:4px 8px;background:transparent;color:var(--ink);width:220px}
  .projname:hover{border-color:var(--line)} .projname:focus{outline:none;border-color:var(--accent);background:#fff}
  .savestate{font-size:12px;color:var(--muted);white-space:nowrap}
  .savestate.dirty{color:var(--warn)} .savestate.ok{color:var(--ok)}
  .spacer{flex:1}
  .seg{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  button,.btn,select.tb{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;line-height:1.25}
  button:hover,.btn:hover{border-color:var(--line2);background:#fbfcfd}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.primary{background:linear-gradient(135deg,#2563eb,#6d4fd8);border-color:#3f55e2;color:#fff;font-weight:600}
  button.primary:hover{background:linear-gradient(135deg,#1d4ed8,#5b3fc4)}
  button.ghost{border-color:transparent;background:transparent}
  button.ghost:hover{background:#f1f3f6}
  button.danger{color:var(--danger)}
  button:disabled{opacity:.4;cursor:default}
  hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  /* menus déroulants */
  .menuwrap{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:50}
  .menu.open{display:block}
  .menu>button,.menu .mi{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
  .menu>button:hover,.menu .mi:hover{background:#f1f4f9}
  .menu kbd{margin-left:auto}
  .menu.right{left:auto;right:0}
  /* mise en page */
  main{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--aside);min-height:0}
  body.layout-plan #view3d,body.layout-plan #vsplit{display:none}
  body.layout-3d main{grid-template-columns:1fr}
  body.layout-3d #planWrap,body.layout-3d #hsplit{display:none}
  body.layout-3d aside{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto 1fr}
  body.layout-3d #view3d{grid-row:1/3;grid-column:1;height:auto}
  body.layout-3d #vsplit{display:none}
  body.layout-3d .tabs{grid-column:2;border-left:1px solid var(--line)}
  body.layout-3d #panel{grid-column:2;border-left:1px solid var(--line)}
  .splitter{background:var(--line);cursor:col-resize;position:relative}
  .splitter:hover,.splitter.drag{background:var(--accent)}
  .splitter.h{cursor:row-resize;height:5px;flex:none}
  #planWrap{display:flex;flex-direction:column;min-height:0;min-width:0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #tools button{display:flex;gap:5px;align-items:center}
  #tools button .ic{font-size:14px;line-height:1}
  #planBox{position:relative;flex:1;min-height:0}
  #plan{position:absolute;inset:0;width:100%;height:100%;background:#fafbfc;touch-action:none;user-select:none;display:block}
  #dimEdit{position:absolute;z-index:5;width:120px;font:600 14px ui-monospace,Consolas,monospace;padding:5px 8px;border:2px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);text-align:center;display:none}
  #zoomPct{min-width:52px;text-align:center;font-size:12px;color:var(--muted)}
  .foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:5px 12px;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
  .foot #hint{flex:1;min-width:200px}
  /* ===== mode guidé : 4 étapes, seuls les outils de l'étape sont visibles, les réglages précis se replient ===== */
  body.guided > header{flex-wrap:nowrap;min-width:0}
  body.guided > header .seg{flex-wrap:nowrap;flex:none}
  body.guided > header .cmdbtn .lbl{display:none}
  body.guided > header .projname{min-width:80px;flex:0 1 200px}
  @media (max-width:1440px){body.guided > header .brand .wm, body.guided > header .brand small{display:none} body.guided #steps button{padding:5px 10px 5px 5px}}
  @media (max-width:1280px){body.guided #saveState{display:none} body.guided #bSettings .lbl{display:none}}
  @media (max-width:1100px){body.guided #steps button{font-size:0;gap:0;padding:4px} body.guided #steps button b{font-size:12px} body.guided #steps button.on{font-size:13px;gap:6px;padding:4px 10px 4px 4px}}
  #steps{display:none;gap:4px;margin-left:10px;flex:none}
  body.guided #steps{display:flex}
  #steps button{display:flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px 5px 6px;font-weight:600;background:transparent;border-color:transparent;color:var(--muted)}
  #steps button b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px}
  #steps button.on{background:var(--accent-weak);color:var(--accent);border-color:#cddbfb}
  #steps button.on b{background:var(--accent);color:#fff}
  #steps button.done b{background:#d1fae5;color:#065f46}
  body.guided[data-step="1"] #tools > :not([data-st~="1"]), body.guided[data-step="2"] #tools > :not([data-st~="2"]),
  body.guided[data-step="3"] #tools > :not([data-st~="3"]), body.guided[data-step="4"] #tools > :not([data-st~="4"]) {display:none}
  body.guided:not([data-step="2"]) #catWrap{display:none}
  body.guided .foot label, body.guided .foot #coords, body.guided #bHist{display:none}
  body.guided .tabs [data-tab="elec"]{display:none}
  .totalbadge{border-radius:999px;font-weight:700;padding:5px 12px;background:#ecfdf5;border-color:#a7f3d0;color:#065f46;white-space:nowrap;flex:none}
  body.mshell .totalbadge{font-size:12px;padding:4px 9px;min-height:0}
  body.mshell > header .projname{min-width:0;flex:1 1 40px}
  .guide{border:1px solid #cddbfb;background:#f6f9ff;border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .guide h3{margin:0 0 4px;display:flex;align-items:center;gap:8px} .guide h3 b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px}
  .guide p{margin:4px 0 10px;line-height:1.5}
  .guide .big{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .guide .big button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;white-space:normal;padding:10px 12px;min-height:56px;font-weight:600}
  .guide .big button span{font-weight:400;font-size:12px;color:var(--muted)}
  .guide .next{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
  .runmods { display: flex; gap: 2px; margin: 10px 0 4px; height: 38px; }
    .runmods span { background: var(--soft, #eef2f6); border: 1px solid #cfd6de; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; min-width: 0; overflow: hidden; }
    .runmods small { font-size: 10px; color: #6b7280; }
    details.adv{margin:10px 0;border:1px solid var(--line);border-radius:10px;padding:0 12px}
  details.adv > summary{cursor:pointer;padding:9px 0;font-weight:600;color:var(--muted);list-style:none}
  details.adv > summary::before{content:'▸ ';} details.adv[open] > summary::before{content:'▾ ';}
  details.adv[open]{padding-bottom:10px}
  .foot label{display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
  .foot select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:#fff}
  #coords{min-width:150px;text-align:right}
  aside{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  #view3d{position:relative;height:var(--v3h);min-height:160px;background:#eef0f3;overflow:hidden;flex:none}
  #view3d.full{position:fixed;inset:46px 0 0 0;height:auto;z-index:25}
  #view3d canvas{display:block}
  .v3bar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:3}
  .v3bar>*{pointer-events:auto}
  .v3bar button{background:#ffffffeb}
  .v3bar button.on{background:var(--accent)}
  .v3menu{width:310px;max-height:70vh;overflow:auto;padding:10px 12px}
  .v3menu h5{margin:10px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .v3menu h5:first-child{margin-top:2px}
  .v3menu label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
  .v3menu label.col{flex-direction:column;align-items:stretch;gap:3px}
  .v3menu select,.v3menu input[type=number]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff}
  .v3menu input[type=range]{width:100%}
  .v3menu .two{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  #wpad{position:absolute;left:14px;bottom:14px;z-index:4;display:none;grid-template-areas:". u x" "l d r";grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px;touch-action:none;user-select:none}
  #wpad.on{display:grid}
  #wpad button{border:0;border-radius:14px;background:#1d2129b3;color:#fff;font-size:20px;padding:0}
  #wpad button:active,#wpad button.on{background:#2563eb}
  #gzInfo{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:#1d2129e6;color:#fff;padding:5px 12px;border-radius:999px;font:600 12.5px system-ui,sans-serif;z-index:4;pointer-events:none;white-space:nowrap}
  #gzInfo[hidden]{display:none}
  #walkHint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#1d2129e0;color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;display:none;white-space:nowrap;z-index:3}
  .lbl3{font-size:12px;font-weight:600;background:#ffffffd9;padding:2px 7px;border-radius:6px;text-align:center;line-height:1.25;pointer-events:none;white-space:nowrap}
  .lbl3 span{display:block;font-weight:400;font-size:11px;color:#555}
  .tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;border:0;border-radius:0;border-bottom:2px solid transparent;padding:9px 4px;background:transparent}
  .tabs button.on{background:none;color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  #panel{flex:1;overflow:auto;padding:14px 16px 28px;min-height:0}
  #panel h3{margin:0 0 2px;font-size:15px}
  #panel h4{margin:18px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .muted{color:var(--muted);font-size:12.5px}
  .warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d9a4;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
  .note{margin-top:10px;padding:8px 10px;background:#f6f8fb;border-radius:8px;font-size:12.5px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
  .f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  .f.full{grid-column:1/-1}
  .f input,.f select{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;background:#fff}
  .f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #2563eb22}
  .f input[type=number]{font-family:ui-monospace,Consolas,monospace}
  .f input[type=color]{padding:2px;height:34px}
  .chk{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:13px;cursor:pointer}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .cmdbtn{color:var(--muted)} .cmdbtn kbd{margin-left:4px}
  .ctx{position:fixed;z-index:120;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
  .ctx[hidden]{display:none}
  .ctx h6{margin:4px 8px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .ctx button{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:13px}
  .ctx button:hover{background:#f1f4f9} .ctx button.danger:hover{background:#fdecea}
  .ctx hr{margin:4px 0}
  .ctx .sub{display:grid;grid-template-columns:1fr 1fr;gap:2px}
  .dragghost{position:fixed;z-index:130;pointer-events:none;background:#1b1f27;color:#fff;font-size:12.5px;padding:5px 10px;border-radius:999px;transform:translate(12px,12px);box-shadow:var(--shadow)}
  .dragghost[hidden]{display:none}
  .cmdk{position:fixed;inset:0;z-index:140;background:#0f172a55;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px}
  .cmdk[hidden]{display:none}
  .cmdk .cbox{width:min(620px,100%);background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:inherit;font-size:16px;outline:none}
  #cmdList{max-height:50vh;overflow:auto;padding:6px}
  #cmdList button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;font-size:14px}
  #cmdList button.on{background:var(--accent-weak)}
  #cmdList button small{margin-left:auto;color:var(--muted);font-size:12px}
  #cmdList .ic{width:22px;text-align:center}
  .cmdk .cfoot{padding:7px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel2)}
  .tipbox{margin-top:10px;padding:8px 10px;background:#fff8e6;border:1px solid #f6e3b0;border-radius:8px;font-size:12.5px;color:#5c4400;line-height:1.45}
  .tipbox b{color:#3d2e00;margin-right:2px}
  .styles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .styles button{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:7px 8px;font-size:12.5px}
  .styles button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--ink)}
  .styles .sw{display:flex;width:100%;height:14px;border-radius:4px;overflow:hidden;border:1px solid #0001}
  .styles .sw i{flex:1}
  .dot{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #0002;vertical-align:-1px;margin-right:6px}
  .tour{position:fixed;inset:0;z-index:150;background:#0f172a73;display:flex;align-items:center;justify-content:center;padding:16px}
  .tour[hidden]{display:none}
  .tour .tbox{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:min(520px,100%);padding:22px 24px 18px}
  .tour .tstep{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tour h2{margin:6px 0 8px;font-size:20px}
  .tour .tico{font-size:40px;line-height:1}
  .tour p{margin:0 0 8px;color:#374151;line-height:1.5}
  .tour .tdots{display:flex;gap:6px;margin:14px 0}
  .tour .tdots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
  .tour .tdots i.on{background:var(--accent)}
  .tour .tnav{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .gloss dt{font-weight:600;margin-top:8px}
  .gloss dd{margin:2px 0 0;color:#4b5563;font-size:13px}
  .swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .swatches button{width:22px;height:22px;padding:0;border-radius:6px;border:1px solid #0002}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .tile b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .tile span{font-size:12px;color:var(--muted)}
  .tile.total{grid-column:1/-1;background:var(--accent-weak);border-color:#c9d8fb}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;color:var(--muted);font-size:11.5px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.c,th.c{text-align:center}
  td input[type=number]{width:62px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;text-align:right}
  tfoot td{font-weight:600;border-bottom:0}
  tr.hcur td{background:var(--accent-weak);font-weight:600} tr.hfut td{color:#a0a7b4}
  .cmp{position:fixed;inset:0;z-index:145;background:#0f172ad9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
  .cmp[hidden]{display:none}
  .cmp .cwrap{position:relative;max-width:min(1200px,96vw);max-height:78vh;aspect-ratio:16/10;width:100%;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px #0008;user-select:none;touch-action:none;cursor:ew-resize}
  .cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .cmp .cline{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #0008;pointer-events:none}
  .cmp .cline::after{content:'⇆';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#1b1f27;border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .cmp .ctag{position:absolute;top:12px;padding:4px 10px;border-radius:999px;background:#000a;color:#fff;font-size:13px;font-weight:600}
  .cmp .cbar{display:flex;gap:8px;align-items:center;color:#fff;font-size:13px}
  #tourCap{position:absolute;left:16px;bottom:16px;z-index:4;background:#1b1f27e0;color:#fff;padding:10px 14px;border-radius:12px;display:none;gap:12px;align-items:center}
  #tourCap b{font-size:16px;display:block} #tourCap span{font-size:12px;opacity:.8}
  tr.clickable{cursor:pointer} tr.clickable:hover td{background:#f6f8fb}
  kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;color:var(--muted)}
  /* catalogue */
  .catalog{width:380px;padding:10px}
  .catalog input{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:8px}
  #catList{max-height:62vh;overflow:auto}
  #catList h6{margin:10px 2px 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  #catList .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}

  while (L >= .30 - 1e-6) {

    case 'beam': g = `<rect x="${n4(x)}" y="${n4(y)}" width="${n4(w)}" height="${n4(d)}" fill="${base}" fill-opacity=".35" ${st} stroke-dasharray="8 3 2 3"/>`; break;
    case 'stairs': { const n = Math.max(2, Math.round(S.H / .175)); for (let i = 1; i < n; i++) g += `<line x1="${n4(x)}" y1="${n4(-y - i * d / n)}" x2="${n4(-x)}" y2="${n4(-y - i * d / n)}" ${th}/>`; g += `<path class="ns" d="M0,${n4(-y - .1)}L0,${n4(y + .2)}M${n4(-.08)},${n4(y + .32)}L0,${n4(y + .2)}L${n4(.08)},${n4(y + .32)}" stroke="#1f2937" stroke-width="1.4" fill="none"/>`; break; }
    case 'sofaCorner': { const sd = Math.min(.95, d * .6); g = `<path d="M${n4(x)},${n4(y)}H${n4(-x)}V${n4(-y)}H${n4(-x - sd)}V${n4(y + sd)}H${n4(x)}Z" fill="${base}" ${st}/><path d="M${n4(x)},${n4(y + .22)}H${n4(-x - .22)}V${n4(-y)}" ${th}/>`; break; }
    case 'deskCorner': { const dw = Math.min(.7, d * .55); g = `<path d="M${n4(x)},${n4(y)}H${n4(-x)}V${n4(y + dw)}H${n4(x + dw)}V${n4(-y)}H${n4(x)}Z" fill="${base}" ${st}/>`; break; }

    case 'bathFree': g += `<ellipse cx="0" cy="0" rx="${n4(w / 2 - .07)}" ry="${n4(d / 2 - .07)}" fill="#fff" ${th}/>`; break;
    case 'doubleVanity': for (const sx of [-1, 1]) g += `<ellipse cx="${n4(sx * w / 4)}" cy="${n4(d * .05)}" rx="${n4(w * .13)}" ry="${n4(d * .26)}" fill="#fff" ${th}/>`; break;
    case 'handBasin': g += `<ellipse cx="0" cy="${n4(d * .05)}" rx="${n4(w * .36)}" ry="${n4(d * .3)}" fill="#fff" ${th}/>`; break;
    case 'bed140': case 'bed180': case 'bunk': case 'crib': g += `<rect x="${n4(x + .05)}" y="${n4(y + .05)}" width="${n4(w - .1)}" height="${n4(Math.min(.3, d * .2))}" rx=".05" fill="#fff" ${th}/><line x1="${n4(x)}" y1="${n4(y + d * .26)}" x2="${n4(-x)}" y2="${n4(y + d * .26)}" ${th}/>`; break;
    case 'loveseat': g += `<line x1="${n4(x)}" y1="${n4(y + .22)}" x2="${n4(-x)}" y2="${n4(y + .22)}" ${th}/>`; break;
    case 'fireplace': case 'stove': g += `<rect x="${n4(-w * .27)}" y="${n4(-y - d * .35)}" width="${n4(w * .54)}" height="${n4(d * .3)}" fill="#f97316" fill-opacity=".7" ${th}/>`; break;
    case 'tvWall': case 'mirror': case 'artwork': case 'curtain': case 'airCon': case 'backsplash': g += `<path d="M${n4(x)},${n4(y)}L${n4(-x)},${n4(-y)}" ${th} stroke-dasharray="3 2"/>`; break;
    case 'dressing': case 'storageUnit': case 'sideboard': case 'dresser': case 'shoeCabinet': { const n = Math.max(2, Math.round(w / (it.type === 'dressing' ? .8 : .4))); for (let k = 1; k < n; k++) g += `<line x1="${n4(x + w * k / n)}" y1="${n4(y)}" x2="${n4(x + w * k / n)}" y2="${n4(-y)}" ${th}/>`; break; }
    case 'outdoorSet': if (it.chairs) for (const sd of [-1, 1]) for (const t of [-.25, .25]) { const [cx, cy] = [t * w, sd * (d / 2 + .22)]; g += `<rect x="${n4(cx - .2)}" y="${n4(cy - .2)}" width=".4" height=".4" fill="#9ca3af" fill-opacity=".6" ${st}/>`; } break;
    case 'coffrage': g = `<rect x="${n4(x)}" y="${n4(y)}" width="${n4(w)}" height="${n4(d)}" fill="${it.color ?? '#a78bfa'}" fill-opacity=".28" stroke="#6d28d9" stroke-width="1.3" stroke-dasharray="6 3" class="ns"/><path class="ns" d="M${n4(x)},${n4(y)}L${n4(-x)},${n4(-y)}" stroke="#6d28d9" stroke-width=".8" stroke-dasharray="2 3"/>`; break;
    case 'plant': case 'lamp': g += `<circle r="${n4(Math.min(w, d) * .4)}" fill="${it.type === 'plant' ? '#6aa56f' : '#f3e6cf'}" ${th}/>`; break;

    case 'oven': case 'wallCabinet': case 'hood': case 'shelf': g += `<path d="M${n4(x)},${n4(y)}L${n4(-x)},${n4(-y)}" ${th} stroke-dasharray="3 2"/>`; break;
    case 'radiator': for (let k = 1; k < 8; k++) g += `<line x1="${n4(x + w * k / 8)}" y1="${n4(y)}" x2="${n4(x + w * k / 8)}" y2="${n4(-y)}" ${th}/>`; break;

    case 'sofa': g += `<line x1="${n4(x)}" y1="${n4(y + .22)}" x2="${n4(-x)}" y2="${n4(y + .22)}" ${th}/>`; break;
    case 'shower': g += `<path d="M${n4(x)},${n4(y)}L${n4(-x)},${n4(-y)}M${n4(-x)},${n4(y)}L${n4(x)},${n4(-y)}" ${th}/>`; break;
    case 'bath': g += `<rect x="${n4(x + .06)}" y="${n4(y + .06)}" width="${n4(w - .12)}" height="${n4(d - .12)}" rx=".12" fill="#fff" ${th}/>`; break;
    case 'vanity': case 'sink': g += `<ellipse cx="0" cy="${n4(d * .05)}" rx="${n4(w * .3)}" ry="${n4(d * .28)}" fill="#fff" ${th}/>`; break;
    case 'wc': g += `<ellipse cx="0" cy="${n4(y + .15 + (d - .15) / 2)}" rx="${n4(w * .38)}" ry="${n4((d - .15) * .44)}" fill="#fff" ${th}/>`; break;
    case 'washer': case 'dryer': g += `<circle r="${n4(Math.min(w, d) * .3)}" fill="#fff" ${th}/>`; break;

        if (m.kind === 'sink') g += `<rect x="${n4(m.x + m.w * .15)}" y="${n4(y + d * .22)}" width="${n4(m.w * .7)}" height="${n4(d * .56)}" rx=".04" fill="#fff" ${th}/>`;
        if (m.kind === 'hob' || m.kind === 'oven') g += [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([a, b]) => `<circle cx="${n4(m.x + m.w / 2 + a * m.w / 4)}" cy="${n4(b * d / 4)}" r="${n4(Math.min(m.w, d) * .14)}" ${th}/>`).join('');

function render2D() {
  if (!A) return;
  EDITS.clear();
  const v = vb(), s = view.s;
  svg.setAttribute('viewBox', `${n4(v.x)} ${n4(v.y)} ${n4(v.w)} ${n4(v.h)}`);
  syncBgImage();
  let h = '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8a909a"/></marker></defs>';
  // quadrillage
  const gx0 = A.ox, gy0 = A.oy, gx1 = A.ox + A.nx / 100, gy1 = A.oy + A.ny / 100, minor = s < .012;
  for (let k = Math.ceil(gx0 * 10); k <= gx1 * 10; k++) if (minor || k % 10 === 0) h += `<line class="${k % 10 ? 'g' : 'gM'}" x1="${k / 10}" y1="${gy0}" x2="${k / 10}" y2="${gy1}"/>`;
  for (let k = Math.ceil(gy0 * 10); k <= gy1 * 10; k++) if (minor || k % 10 === 0) h += `<line class="${k % 10 ? 'g' : 'gM'}" x1="${gx0}" y1="${k / 10}" x2="${gx1}" y2="${k / 10}"/>`;
  // sols
  const selRoom = sel?.kind === 'room' ? A.regionAt(sel.x, sel.y) : null;
  for (const r of A.rooms) {
    const t = r.tags[0], col = r === selRoom ? '#d3e0ff' : t ? (t.floorTint ?? FLOORS[t.floor]?.color ?? '#eee') : '#f4f4f4';
    const d = r.rects.map(q => `M${n4(q.x0)},${n4(q.y0)}H${n4(q.x1)}V${n4(q.y1)}H${n4(q.x0)}Z`).join('');
    h += `<path data-kind="room" d="${d}" fill="${col}"${bgOn() ? ' fill-opacity=".3"' : t ? '' : ' fill-opacity=".9"'}/>`;
  }
  // volumes électriques de salle de bain (NF C 15-100) : volume 1 = au-dessus du receveur/baignoire, volume 2 = 60 cm autour
  if (layer.elec || (placing && CAT[placing]?.elec) || (sel?.kind === 'item' && isElec(resolveSel() ?? {}))) {
    for (const it of S.items.filter(i => i.type === 'shower' || i.type === 'bath')) {
      const f = fp(it), e = .60;
      h += `<path d="M${n4(f.x - e)},${n4(f.y - e)}H${n4(f.x + f.w + e)}V${n4(f.y + f.h + e)}H${n4(f.x - e)}Z M${n4(f.x)},${n4(f.y)}V${n4(f.y + f.h)}H${n4(f.x + f.w)}V${n4(f.y)}Z" fill="#f97316" fill-opacity=".14" fill-rule="evenodd" stroke="#f97316" stroke-dasharray="5 3" stroke-width="1" class="ns" pointer-events="none"/>`;
      h += `<rect x="${n4(f.x)}" y="${n4(f.y)}" width="${n4(f.w)}" height="${n4(f.h)}" fill="#dc2626" fill-opacity=".14" pointer-events="none"/>`;
      h += `<text class="t2" x="${n4(f.x + f.w / 2)}" y="${n4(f.y - e + 9 * s)}" font-size="${n4(9.5 * s)}" stroke-width="${n4(3 * s)}" style="fill:#c2410c">Volume 2 (60 cm) : ni prise ni interrupteur</text>`;
    }
  }

  for (const it of items) {

    const f = fp(it), cx = f.x + f.w / 2, cy = f.y + f.h / 2, vert = f.h > f.w * 1.3 && f.w < .5;

    if (isElec(it) || CAT[it.type]?.sym) h += `<title>${esc(it.name)} · ${CAT[it.type].ceil ? 'au plafond' : `axe à ${cmTxt(axisH(it))} ${UNIT()} du sol`}</title>`;
    else if (it.type === 'coffrage' && Math.min(f.w, f.h) / s > 14) h += `<text class="t2" x="${n4(cx)}" y="${n4(cy)}" font-size="${n4(10 * s)}" stroke-width="${n4(3 * s)}"${vert ? ` transform="rotate(-90 ${n4(cx)} ${n4(cy)})"` : ''} style="fill:#5b21b6">Coffrage −${cmTxt(itemH(it, .2))} ${UNIT()}</text>`;
    else if (Math.min(f.w, f.h) / s > 22 && it.type !== 'rug') h +=`<text class="t2" x="${n4(cx)}" y="${n4(cy)}" font-size="${n4(10 * s)}" stroke-width="${n4(3 * s)}"${vert ? ` transform="rotate(-90 ${n4(cx)} ${n4(cy)})"` : ''}>${esc(it.name)}</text>`;

    h += `<g class="alert" data-kind="item" data-id="${al.it.id}"><circle cx="${n4(x)}" cy="${n4(y)}" r="${n4(r)}" fill="${al.lvl === 'warn' ? '#f59e0b' : '#3b82f6'}" stroke="#fff" stroke-width="1.5" class="ns"/><text x="${n4(x)}" y="${n4(y)}" font-size="${n4(10 * s)}" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="central" style="pointer-events:none">${al.lvl === 'warn' ? '!' : 'i'}</text><title>${esc(al.t)}</title></g>`;

      h += `<line class="ns" x1="${n4(p1[0])}" y1="${n4(p1[1])}" x2="${n4(p2[0])}" y2="${n4(p2[1])}" stroke="${selW ? 'var(--accent)' : '#8a93a3'}" stroke-width="${selW ? 2.5 : 1.5}" stroke-dasharray="7 5" pointer-events="none"/>`;
      continue;
    }
    if (isArc(w)) { h += poly(wallShape(w), `class="wall" data-kind="wall" data-id="${w.id}" fill="${fill}"`); continue; }
    if (w.glassAbove && isLow(w)) {
      const p1 = at(w, f, 0), p2 = at(w, f, f.L);
      lowLines += `<line class="ns" x1="${n4(p1[0])}" y1="${n4(p1[1])}" x2="${n4(p2[0])}" y2="${n4(p2[1])}" stroke="#1f2937" stroke-width="2" pointer-events="none"/><line class="ns" x1="${n4(p1[0])}" y1="${n4(p1[1])}" x2="${n4(p2[0])}" y2="${n4(p2[1])}" stroke="#7cc4ef" stroke-width="1" stroke-dasharray="6 4" pointer-events="none"/>`;

    h += `<g class="op" data-kind="opening" data-id="${o.id}">` + poly(wallPoly(w, f, o.at, o.at + o.width), `fill="${sl ? '#dbe6ff' : '#fff'}" fill-opacity="${sl ? 1 : .01}"`);
    if (o.type === 'door' && (o.style === 'coulissante' || o.style === 'galandage')) {

      const a1 = at(w, f, o.at + (gal ? o.width * dirS : o.width * .5 * dirS), off), a2 = at(w, f, o.at + o.width + (gal ? o.width * dirS : o.width * .5 * dirS), off);
      h += `<line class="ns" x1="${n4(a1[0])}" y1="${n4(a1[1])}" x2="${n4(a2[0])}" y2="${n4(a2[1])}" stroke="${col}" stroke-width="3" ${gal ? 'stroke-dasharray="5 3"' : ''}/>`;
      const m1 = at(w, f, o.at + o.width * .3, sd * (w.t / 2 + .09)), m2 = at(w, f, o.at + o.width * .7, sd * (w.t / 2 + .09));
      h += `<line class="ns" x1="${n4(dirS > 0 ? m1[0] : m2[0])}" y1="${n4(dirS > 0 ? m1[1] : m2[1])}" x2="${n4(dirS > 0 ? m2[0] : m1[0])}" y2="${n4(dirS > 0 ? m2[1] : m1[1])}" stroke="#8a909a" stroke-width="1" marker-end="url(#arr)"/>`;

        const hp = at(w, f, hs, sd * w.t / 2), u = [f.u[0] * ud, f.u[1] * ud], nn = [f.n[0] * sd, f.n[1] * sd];
        let arc = ''; for (let i = 0; i <= 14; i++) { const th = i / 14 * Math.PI / 2; arc += `${i ? 'L' : 'M'}${n4(hp[0] + half * (nn[0] * Math.cos(th) + u[0] * Math.sin(th)))},${n4(hp[1] + half * (nn[1] * Math.cos(th) + u[1] * Math.sin(th)))}`; }

    } else if (o.type === 'door') {

      h += `<path d="${arc}L${n4(g.hp[0])},${n4(g.hp[1])}Z" fill="${sl ? '#2563eb2e' : '#2563eb0d'}"/><path class="ns" d="${arc}" fill="none" stroke="${sl ? '#2563eb' : '#8a909a'}" stroke-width="1"/>`;

function faceItems(w, sd) {

function applySizes() { document.documentElement.style.setProperty('--aside', prefs.aside + 'px'); document.documentElement.style.setProperty('--v3h', prefs.v3h + '%'); }
function splitter(id, onMove) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.classList.add('drag'); el.setPointerCapture(e.pointerId);
    const mv = ev => { onMove(ev); applySizes(); resize3D(); schedule(false); };
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); savePrefs(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
splitter('hsplit', ev => { prefs.aside = clamp(innerWidth - ev.clientX, 300, innerWidth - 360); });
splitter('vsplit', ev => { const r = document.querySelector('aside').getBoundingClientRect(); prefs.v3h = clamp((ev.clientY - r.top) / r.height * 100, 15, 85); });
// --- pied de page : unité, pas, aimant, calques
document.getElementById('unitSel').onchange = e => { prefs.unit = e.target.value; savePrefs(); renderAll(); };
document.getElementById('snap').onchange = e => { prefs.snap = e.target.value; savePrefs(); };
document.getElementById('lMagnet').onchange = e => { prefs.magnet = e.target.checked; savePrefs(); };
document.getElementById('lAlerts').checked = prefs.alerts !== false;
document.getElementById('lAlerts').onchange = e => { prefs.alerts = e.target.checked; savePrefs(); renderAll(); };
for (const [id, k] of [['lDims', 'dims'], ['lElec', 'elec'], ['lFurn2', 'furn']]) document.getElementById(id).addEventListener('change', e => { prefs.layers[k] = e.target.checked; savePrefs(); });
// --- nom du projet
const pn = document.getElementById('projName');
pn.addEventListener('change', () => { S.name = pn.value.trim() || 'Appartement'; pn.value = S.name; document.title = S.name + ' · Atelier'; commit(); });
pn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') pn.blur(); });
// --- raccourcis globaux
let clip = null;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 's') { e.preventDefault(); saveFile(e.shiftKey); return; }
  if (mod && k === 'o') { e.preventDefault(); openFile(); return; }
  if (e.target.closest('input,select,textarea')) return;
  if (k === 'escape' && !document.getElementById('modal').hidden) { closeModal(); return; }
  if (mod && k === 'c' && sel?.kind === 'item') { clip = JSON.stringify(resolveSel()); toast('Objet copié · Ctrl+V pour le coller (sans frais de livraison)'); return; }
  if (mod && k === 'v' && clip) { const it = { ...JSON.parse(clip), id: uid() }; it.x = r2(view.cx - fp(it).w / 2); it.y = r2(view.cy - fp(it).h / 2); S.items.push(it); sel = { kind: 'item', id: it.id }; commit(); return; }
  if (mod) return;
  if (k === 'a') { e.preventDefault(); document.getElementById('bCatalog').click(); }
  else if (k === '0') { fit(); schedule(false); }
  else if (k === '?') openHelp();
  else if (k === '1' || k === '2' || k === '3') setLayout({ 1: 'plan', 2: 'split', 3: '3d' }[k]);
}, true);
// --- état initial de l'interface
pn.value = S.name; document.title = S.name + ' · Atelier';
applySizes(); syncPrefsUI(); setLayout(prefs.layout);
lastSaveAt = new Date(); fileDirty = true; updateSaveState();
backup('Ouverture du projet');

// interface mobile (téléphone, petite tablette)
const TOOL_TIP = { wall: '▭ Mur : touche le départ puis chaque angle', door: '🚪 Porte : touche un mur', window: '🪟 Fenêtre : touche un mur', baie: '🪟 Baie : touche un mur', opening: '⬚ Passage : touche un mur', placard: '🗄 Placard : touche un mur', dim: '↔ Cote : touche deux points', measure: '📏 Mesure : touche deux points', calib: '📏 Échelle : touche les 2 bouts d’une longueur connue', bgmove: '✋ Glisse le plan de fond' };
ML.mobileShell({
  planBox: '#planBox', zoom: { in: '#zIn', out: '#zOut', fit: '#zFit' }, tools: '#tools [data-tool]',
  icons: { baie: '🪟', opening: '⬚', placard: '🗄' },
  extra: [{ ic: '🖼', label: 'Plan de fond', run: openBg }, { ic: '🔍', label: 'Rechercher', run: openCmd }, { ic: '🎬', label: 'Visite', run: () => { ML.mobile().show('3d'); autoTour(); } }, { ic: '⇆', label: 'Avant / après', run: openCompare }, { ic: '📷', label: 'Capture', run: () => { ML.mobile().show('3d'); setTimeout(beautyShot, 60); } }, { ic: '📄', label: 'Devis', run: openDevis }],
  layers: ['lDims', 'lElec', 'lFurn2', 'lAlerts', 'lMagnet', 'snap', 'unitSel'],
  relocate: ['catalog', 'v3menu'], sheets: ['catalog', 'projMenu', 'v3menu'], closeMenus: () => closeMenus(),
  onAdd: () => document.getElementById('bCatalog').click(), selectTool: () => setTool('select'), hasSel: () => !!sel,
  toolLabel: () => tool === 'select' ? null : tool === 'kit' && kitPlacing ? `✨ ${KITS[kitPlacing].label} : touche où le poser` : tool === 'place' && placing ? `${CAT[placing].label} : touche un mur` : TOOL_TIP[tool] ?? null,
  hint: () => tool !== 'select' ? null
    : !S.walls.length ? { key: 'start', text: '🧱 Plan vide : 🛠 Outils → Mur, puis touche chaque angle de la pièce. Ou importe un plan de fond.' }
    : !sel ? { key: 'tap', text: '👆 Touche un meuble, un mur ou une pièce : tout ce que tu peux en faire s’affiche.' }
    : ['item', 'wall', 'opening'].includes(sel.kind) ? { key: 'drag', text: '✋ C’est sélectionné : glisse-le du doigt pour le déplacer.' }
    : sel.kind === 'room' ? { key: 'room', text: '🎨 Ambiance repeint toute la pièce d’un coup. ✏️ Modifier règle murs, sol et travaux.' } : null,
  onView: v => { setTimeout(() => { if (v === '3d') resize3D(); if (v === 'panel') renderPanel(); schedule(false); }, 30); },
  onToggle: on => { if (on && prefs.layout !== 'split') setLayout('split'); setTimeout(() => { resize3D(); schedule(false); }, 50); },
});
setTool('select');
renderAll();
requestAnimationFrame(() => { fit(); render2D(); resize3D(); setView('persp'); loop(); });
if (new URLSearchParams(location.search).has("debug")) window.__m3 = { scene, get cam() { return cam; }, renderer, ctl, build: () => { build3D(); dirty3D = false; }, render: () => renderer.render(scene, cam), S: () => S, opt, A: () => A, commit: () => commit(), pick: id => { sel = { kind: "item", id }; tab = "sel"; renderPanel(); }, fn: { fitLayout, kitLayout, doorZones, autoFurnish, autoKits } };
if (new URLSearchParams(location.search).get('demo')) {
  history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(PID));
  // appartement témoin : une ambiance par pièce et quelques travaux cochés, pour montrer le rendu final
  const pick = { sejour: 'scandinave', cuisine: 'contemporain', sdb: 'marin', wc: 'boheme', circ: 'classique' }, ch = ['cocooning', 'nature', 'japandi']; let ci = 0;
  for (const r of A.rooms) { const t = r.tags[0]; if (!t) continue; const ty = roomType(t.name), st = ty === 'chambre' ? ch[ci++ % 3] : pick[ty]; if (st) applyStyle(r, st); t.works.paint = true; t.works.floor = ty !== 'sdb'; }
  commit();
  setTimeout(() => toast('🏠 Bienvenue dans l’appartement témoin. Ici, tout est permis : casse, repeins, déplace. C’est fait pour.', 6000), 600);
  if (!prefs.toured) setTimeout(startTour, ML.mobile()?.on() ? 6800 : 2500);   // sur téléphone : après le message d'accueil, qui masquerait le guide
}
else if (new URLSearchParams(location.search).get('bg')) { history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(PID)); setTimeout(openBg, 300); }
else if (!prefs.toured) setTimeout(startTour, 400);
</script>
