<head>

<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0f766e">
<style>
  :root{--bg:#eef0f3;--panel:#fff;--ink:#1b1f27;--muted:#5d6678;--line:#e1e5eb;--line2:#cfd5de;--accent:#0f766e;--accent2:#2563eb;--accent-weak:#e6f5f2;--danger:#b42318;--warn:#9a5b00;--warn-bg:#fff6e5;--aside:470px;--v3h:52%;--shadow:0 8px 30px #0f172a1f}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
  .brand{font-size:15px;display:flex;gap:6px;align-items:center;color:var(--accent);text-decoration:none} .brand b{color:var(--ink)}
  .projname{font:inherit;font-weight:600;border:1px solid transparent;border-radius:7px;padding:4px 8px;background:transparent;color:var(--ink);width:230px}
  .projname:hover{border-color:var(--line)} .projname:focus{outline:none;border-color:var(--accent);background:#fff}
  .savestate{font-size:12px;color:#15803d;white-space:nowrap}
  .sp{flex:1}
  .seg{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;line-height:1.25}
  button:hover,.btn:hover{border-color:var(--line2)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.ghost{border-color:transparent;background:transparent} button.ghost:hover{background:#f1f3f6}
  button.danger{color:var(--danger)} button:disabled{opacity:.4;cursor:default}
  hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  .menuwrap{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:60}
  .menu.open{display:block} .menu.right{left:auto;right:0}
  .menu>button,.menu .mi{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
  .menu>button:hover,.menu .mi:hover{background:#f1f4f9}
  main{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--aside);min-height:0}
  body.layout-2d #view3d,body.layout-2d #vsplit{display:none}
  body.layout-3d main{grid-template-columns:1fr} body.layout-3d #planWrap,body.layout-3d #hsplit{display:none}
  body.layout-3d aside{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:auto 1fr}
  body.layout-3d #view3d{grid-row:1/3;grid-column:1;height:auto} body.layout-3d #vsplit{display:none}
  body.layout-3d .tabs,body.layout-3d #panel{grid-column:2;border-left:1px solid var(--line)}
  .splitter{background:var(--line);cursor:col-resize} .splitter:hover{background:var(--accent)} .splitter.h{cursor:row-resize;height:5px;flex:none}
  #planWrap{display:flex;flex-direction:column;min-height:0;min-width:0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  .wp{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .wp input{width:78px;font:12px ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  #planBox{position:relative;flex:1;min-height:0}
  #plan{position:absolute;inset:0;width:100%;height:100%;background:#fafbfc;touch-action:none;user-select:none}
  #dimEdit{position:absolute;z-index:5;width:120px;font:600 14px ui-monospace,Consolas,monospace;padding:5px 8px;border:2px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);text-align:center;display:none}
  .viewtag{position:absolute;left:10px;top:8px;background:#ffffffe0;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--muted);pointer-events:none}
  .foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:5px 12px;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
  .foot #hint{flex:1;min-width:200px} .foot label{display:flex;gap:5px;align-items:center;cursor:pointer}
  .foot select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 4px}
  #coords{font-family:ui-monospace,Consolas,monospace;min-width:190px;text-align:right}
  aside{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  #view3d{position:relative;height:var(--v3h);min-height:160px;background:#dfe7ee;overflow:hidden;flex:none}
  #view3d canvas{display:block}
  .v3bar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:3}
  .v3bar>*{pointer-events:auto} .v3bar button{background:#ffffffeb} .v3bar button.on{background:var(--accent)}
  .v3menu{width:270px;padding:10px 12px} .v3menu label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px;cursor:pointer}
  .v3menu h5{margin:8px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;border:0;border-radius:0;border-bottom:2px solid transparent;padding:9px 4px;background:transparent}
  .tabs button.on{background:none;color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  #panel{flex:1;overflow:auto;padding:14px 16px 28px;min-height:0}
  #panel h3{margin:0 0 2px;font-size:15px}
  #panel h4{margin:16px 0 7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .muted{color:var(--muted);font-size:12.5px}
  .note{margin-top:10px;padding:8px 10px;background:#f6f8fb;border-radius:8px;font-size:12.5px;color:var(--muted)}
  .warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d9a4;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px;margin-top:6px}
  .f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)} .f.full{grid-column:1/-1}
  .f input,.f select{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;background:#fff}
  .f input[type=number]{font-family:ui-monospace,Consolas,monospace}
  .f input[type=color]{padding:2px;height:34px}
  .chk{display:flex;gap:8px;align-items:center;margin:7px 0;font-size:13px;cursor:pointer}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px} .tile b{display:block;font-size:18px;font-variant-numeric:tabular-nums} .tile span{font-size:12px;color:var(--muted)}
  .tile.total{grid-column:1/-1;background:var(--accent-weak);border-color:#b7e2da}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;color:var(--muted);font-size:11.5px} td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td input[type=number]{width:70px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;text-align:right}
  details{margin-top:6px} summary{cursor:pointer;color:var(--accent);font-size:12.5px}
  .bar{display:flex;height:20px;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin:3px 0;font-size:9.5px}
  .bar span{padding:0 4px;background:#d9c19a;border-right:1px solid #8a6a3e;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
  .bar span.st{background:#c4ccd6;border-right-color:#5d6678} .bar i{flex:1;background:repeating-linear-gradient(45deg,#fff,#fff 3px,#eee 3px,#eee 6px)}
  .gens{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .gens button{white-space:normal;text-align:left;padding:10px} .gens b{display:block;font-size:13.5px} .gens span{font-size:12px;color:var(--muted)}
  .modal{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 16px;overflow:auto}
  .modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);display:flex;flex-direction:column}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
  #mBody{padding:14px 16px 18px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1b1f27;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200}
  #toast.show{opacity:1;transform:translateX(-50%)}
  .lbl3{font:600 11px system-ui;background:#ffffffe6;padding:3px 8px;border-radius:5px;pointer-events:none;white-space:nowrap;color:#0f766e}
  .ns{vector-effect:non-scaling-stroke}
  .g{stroke:#eceef1;stroke-width:1;vector-effect:non-scaling-stroke} .gM{stroke:#d3d8df;stroke-width:1;vector-effect:non-scaling-stroke}
  .t2{fill:#1f2937;paint-order:stroke;stroke:#ffffffd0;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .dimt{font-weight:600;paint-order:stroke;stroke:#fafbfc;text-anchor:middle;dominant-baseline:middle}
  .mem{cursor:pointer} .mem:hover{filter:brightness(1.12)}
  kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
  @media (max-width:980px){body{height:auto;overflow:auto;display:block} main{display:block} #planBox{height:62vh;flex:none} #hsplit,#vsplit{display:none} #view3d{height:50vh}}
</style>

<body class="layout-split">
<header>
  <a class="brand" href="index.html" title="Retour à mes projets">⌂ <b>Moovo 3D</b></a>
  <input id="projName" class="projname" spellcheck="false">
  <span id="saveState" class="savestate"></span>
  <div class="menuwrap"><button id="bProj" class="ghost">Projet ▾</button>
    <div class="menu" id="projMenu">
      <button data-cmd="save">💾 Enregistrer dans un fichier <kbd>Ctrl+S</kbd></button>
      <button data-cmd="devis">📄 Générer le devis…</button>
      <button data-cmd="csv">📋 Liste de débit (CSV)</button>
      <button data-cmd="share">🔗 Partager par lien…</button>
      <hr>
      <button data-cmd="versions">🕘 Versions…</button>
      <button data-cmd="snapshot">📌 Créer un point de sauvegarde</button>
      <hr>
      <button data-cmd="shot">📷 Capture 3D (PNG)</button>
      <button data-cmd="svg">🖨 Exporter la vue 2D cotée (SVG)</button>
      <label class="mi">Importer un projet (.json)<input type="file" id="fImport" accept=".json" hidden></label>
    </div>
  </div>
  <div class="seg"><button id="bUndo" class="ghost" title="Annuler (Ctrl+Z)">↶</button><button id="bRedo" class="ghost" title="Rétablir (Ctrl+Y)">↷</button></div>
  <div class="sp"></div>
  <div class="seg"><button data-layout="2d">2D</button><button data-layout="split" class="on">2D + 3D</button><button data-layout="3d">3D</button></div>
  <button id="bHelp" class="ghost" title="Aide (?)">?</button>
</header>
<main>
  <section id="planWrap">
    <div class="toolbar">
      <div class="seg" id="views"><button data-view="top" class="on" title="Vue de dessus (T)">Dessus</button><button data-view="front" title="Vue de face, depuis le sud (F)">Face</button><button data-view="side" title="Vue de côté, depuis l’ouest (L)">Côté</button></div>
      <div class="seg" id="tools">
        <button data-tool="select" class="on" title="Sélection (V)">↖ Sélection</button>
        <button data-tool="beam" title="Barre : poutre, solive, lisse… (B)">▬ Barre</button>
        <button data-tool="post" title="Poteau vertical (P)">▮ Poteau</button>
        <button data-tool="panel" title="Panneau : couverture, bardage, plancher (N)">▦ Panneau</button>
        <button data-tool="dim" title="Coter (C)">↔ Coter</button>
      </div>
      <div class="menuwrap"><button id="bGen" class="pri">✨ Assistants ▾</button><div class="menu" id="genMenu"></div></div>
      <span class="wp" id="wpBox" title="Les points dessinés sont posés sur ce plan de travail"><span id="wpLbl">Niveau Z</span><input id="wp" type="number" step="1"> <span class="u"></span></span>
      <div class="sp"></div>
      <div class="seg"><button id="zOut">−</button><button id="zFit" title="Tout voir (0)">Ajuster</button><button id="zIn">+</button></div>
    </div>
    <div id="planBox"><svg id="plan"><g id="G"></g></svg><div class="viewtag" id="viewTag"></div><input id="dimEdit" autocomplete="off"></div>
    <div class="foot">
      <span id="hint"></span>
      <label><input type="checkbox" id="lDims" checked> Cotes</label>
      <label><input type="checkbox" id="lPanels" checked> Panneaux</label>
      <label><input type="checkbox" id="lGrid" checked> Grille</label>
      <label>Pas <select id="snap"><option value="0.001">1 mm</option><option value="0.005">5 mm</option><option value="0.01" selected>1 cm</option><option value="0.05">5 cm</option><option value="0.1">10 cm</option></select></label>
      <label>Unité <select id="unitSel"><option value="cm">cm</option><option value="mm">mm</option></select></label>
      <span id="coords"></span>
    </div>
  </section>
  <div id="hsplit" class="splitter"></div>
  <aside>
    <div id="view3d">
      <div class="v3bar">
        <div class="seg"><button data-v="persp" class="on">3D</button><button data-v="top">Dessus</button><button data-v="front">Face</button></div>
        <div class="seg"><button id="bFrame">Cadrer</button>
          <div class="menuwrap"><button id="bV3">Affichage ▾</button><div class="menu right v3menu" id="v3menu">
            <h5>Afficher</h5>
            <label><input type="checkbox" id="oPanels" checked> Couvertures, bardages, planchers</label>
            <label><input type="checkbox" id="oXray"> Panneaux transparents</label>
            <label><input type="checkbox" id="oBlocks" checked> Bâtiment existant</label>
            <label><input type="checkbox" id="oGround" checked> Terrain</label>
            <label><input type="checkbox" id="oLen"> Longueurs des barres</label>
            <label><input type="checkbox" id="oShadow" checked> Ombres</label>
            <h5>Couleur</h5>
            <label><input type="radio" name="oColor" value="mat" checked> Par matériau</label>
            <label><input type="radio" name="oColor" value="role"> Par fonction (poteau, poutre…)</label>
          </div></div>
          <button id="bShot" title="Capture">📷</button></div>
      </div>
    </div>
    <div id="vsplit" class="splitter h"></div>
    <nav class="tabs"><button data-tab="sel" class="on">Sélection</button><button data-tab="bom">Métré & débit</button><button data-tab="gens">Assistants</button><button data-tab="prices">Prix</button></nav>
    <div id="panel"></div>
  </aside>
</main>
<div id="toast"></div>
<div id="modal" class="modal" hidden><div class="mbox"><div class="mhead"><b id="mTitle"></b><button id="mClose" class="ghost">✕</button></div><div id="mBody"></div></div></div>

    for (let i = 1; i <= n; i++) for (const s of sel) { const o = clone(find(s)); o.id = s.k + uid(); delete o.gen; const dd = mul(d, i); if (o.a) { o.a = add(o.a, dd).map(r3); o.b = add(o.b, dd).map(r3); } else if (o.p0) o.p0 = add(o.p0, dd).map(r3); else { o.x += dd[0]; o.y += dd[1]; } (s.k === 'm' ? S.members : s.k === 'p' ? S.panels : S.blocks).push(o); }
    closeModal(); commit(); toast(n + ' copie(s) créée(s)');
  };
}
// --- devis, CSV
function openDevis() {
  const lines = devisLines(); if (!lines.length) return toast('Rien à chiffrer : crée une structure avec un assistant ou dessine des barres.');
  renderer.render(scene, cam); const img = renderer.domElement.toDataURL('image/jpeg', .85);
  const B = bom(), annex = `<h2>Liste de débit</h2><table><thead><tr><th>Section</th><th>Matériau</th><th class="n">Pièces</th><th>Longueurs</th><th class="n">Barres</th></tr></thead><tbody>${B.rows.map(r => `<tr><td>${esc(r.s.l)}</td><td>${esc(r.mt.l)}</td><td class="n">${r.n}</td><td>${[...new Set(r.pieces.map(p => L(p)))].slice(0, 12).join(', ')} ${UNIT()}</td><td class="n">${r.plan ? `${r.bars} × ${fm(r.stock, 1)} m` : '—'}</td></tr>`).join('')}</tbody></table>`;
  C.devisDialog({ projectName: S.name, objet: 'Fourniture et pose — ' + S.name, lines, state: S.devis, defaultTva: 20, onSave: st => { S.devis = st; save(); }, images: [{ title: 'Vue 3D du projet', src: img }], annexHtml: annex });
}
function exportCSV() {
  const rows = [['Repère', 'Fonction', 'Section', 'Matériau', `Longueur (${UNIT()})`, 'Xa', 'Ya', 'Za', 'Xb', 'Yb', 'Zb']];
  S.members.forEach((m, i) => rows.push([`B${i + 1}`, ROLES[m.role]?.[0] ?? '', sec(m).l, MAT[m.mat]?.l ?? '', L(mLen(m)), ...m.a.map(L), ...m.b.map(L)]));
  rows.push([]); rows.push(['Récapitulatif', '', 'Section', 'Matériau', 'Pièces', 'Total (m)', 'Barres', 'Longueur barre (m)']);
  for (const r of bom().rows) rows.push(['', '', r.s.l, r.mt.l, r.n, fm(r.total), r.bars ?? '', r.stock ?? '']);
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  download(new Blob([csv], { type: 'text/csv' }), slug(S.name) + '-liste-de-debit.csv');
}

// =====================================================================
//  Application : outils, vues, fichiers, raccourcis
// =====================================================================
let toastT; function toast(m, ms = 2600) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const slug = n => (n || 'projet').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
function download(data, name) { const a = document.createElement('a'); a.href = typeof data === 'string' && data.startsWith('data:') ? data : URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = name; a.click(); }
const HINTS = { select: 'Clic : sélectionner · Maj+clic : ajouter · glisser : déplacer · ronds bleus : déplacer une extrémité · glisser le fond : se déplacer',
  beam: 'Clique le départ puis l’arrivée de la barre (Maj = horizontale/verticale) · s’aimante aux extrémités · double-clic ou Échap pour arrêter',
  post: 'Clique pour poser un poteau (hauteur dans l’onglet Sélection quand rien n’est sélectionné)', panel: 'Clique deux coins opposés du panneau sur le plan de travail', dim: 'Clique deux points pour poser une cote' };
function setTool(t) { tool = t; draw = null; document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); document.getElementById('hint').textContent = HINTS[t]; svg.style.cursor = t === 'select' ? 'default' : 'crosshair'; render2D(); }
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
function setView(v) {
  view = v; prefs.view = v; savePrefs(); document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  document.getElementById('wpLbl').textContent = VIEWS[v].h; syncWp(); fit(); render2D();
}
function syncWp() { const el = document.getElementById('wp'); el.value = prefs.unit === 'mm' ? Math.round(wpVal() * 1000) : Math.round(wpVal() * 1000) / 10; document.querySelector('#wpBox .u').textContent = UNIT(); }
document.getElementById('wp').addEventListener('change', e => { const v = r3((parseFloat(e.target.value.replace(',', '.')) || 0) / UF()); if (view === 'top') S.settings.level = v; else if (view === 'front') S.settings.plane = v; else S.settings.side = v; commit(); });
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView3(b.dataset.v));
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderPanel(); });
document.getElementById('zIn').onclick = () => { vw.s /= 1.25; render2D(); }; document.getElementById('zOut').onclick = () => { vw.s *= 1.25; render2D(); }; document.getElementById('zFit').onclick = () => { fit(); render2D(); };
document.getElementById('bFrame').onclick = frameSel;
const shot = () => { renderer.render(scene, cam); download(renderer.domElement.toDataURL('image/png'), slug(S.name) + '-3d.png'); };
document.getElementById('bShot').onclick = shot;
// options
for (const [id, k] of [['oPanels', 'panels'], ['oXray', 'xray'], ['oBlocks', 'blocks'], ['oGround', 'ground'], ['oLen', 'len'], ['oShadow', 'shadow']]) { const el = document.getElementById(id); el.checked = !!o3[k]; el.onchange = () => { o3[k] = el.checked; prefs.o = o3; savePrefs(); dirty3D = true; }; }
document.querySelectorAll('[name=oColor]').forEach(r => { r.checked = r.value === o3.color; r.onchange = () => { o3.color = prefs.o.color = r.value; savePrefs(); dirty3D = true; render2D(); }; });
for (const [id, k] of [['lDims', 'dims'], ['lPanels', 'panels'], ['lGrid', 'grid']]) { const el = document.getElementById(id); el.checked = !!prefs.l[k]; el.onchange = () => { prefs.l[k] = el.checked; savePrefs(); render2D(); }; }
document.getElementById('snap').value = prefs.snap; document.getElementById('snap').onchange = e => { prefs.snap = e.target.value; savePrefs(); };
document.getElementById('unitSel').value = prefs.unit; document.getElementById('unitSel').onchange = e => { prefs.unit = e.target.value; savePrefs(); syncWp(); renderAll(); };
// menus
const menus = [['bProj', 'projMenu'], ['bGen', 'genMenu'], ['bV3', 'v3menu']];
document.getElementById('genMenu').innerHTML = Object.entries(GEN).map(([k, g]) => `<button data-gen="${k}">${g.l}</button>`).join('');
for (const [b, m] of menus) document.getElementById(b).addEventListener('click', e => { e.stopPropagation(); const el = document.getElementById(m), o = !el.classList.contains('open'); menus.forEach(([, x]) => document.getElementById(x).classList.remove('open')); el.classList.toggle('open', o); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menuwrap')) menus.forEach(([, x]) => document.getElementById(x).classList.remove('open')); });
document.getElementById('genMenu').addEventListener('click', e => { const b = e.target.closest('[data-gen]'); if (b) { document.getElementById('genMenu').classList.remove('open'); genDialog(b.dataset.gen); } });
async function saveFile() {
  const data = JSON.stringify(S, null, 2);
  if (window.showSaveFilePicker) { try { fileHandle ??= await window.showSaveFilePicker({ suggestedName: slug(S.name) + '.json', types: [{ description: 'Projet Moovo 3D', accept: { 'application/json': ['.json'] } }] }); const w = await fileHandle.createWritable(); await w.write(data); await w.close(); toast('💾 Enregistré dans ' + fileHandle.name); return; } catch (e) { if (e.name === 'AbortError') return; } }
  download(new Blob([data], { type: 'application/json' }), slug(S.name) + '.json'); toast('💾 Fichier téléchargé');
}
function openVersions() {
  const l = backups();
  openModal('Versions', `<p class="muted" style="margin-top:0">Une version est gardée automatiquement toutes les 5 minutes de travail.</p><table><tbody>${l.map((b, i) => `<tr><td>${new Date(b.t).toLocaleString('fr-FR')}<div class="muted">${esc(b.label)}</div></td><td class="n"><button data-v="${i}">Restaurer</button></td></tr>`).join('') || '<tr><td class="muted">Aucune version.</td></tr>'}</tbody></table>`);
  document.querySelectorAll('#mBody [data-v]').forEach(b => b.onclick = () => { if (!confirm('Restaurer cette version ?')) return; backup('Avant restauration', false); S = migrate(JSON.parse(l[+b.dataset.v].data)); sel = []; commit(); closeModal(); fit(); render2D(); });
}
async function share() {
  try { const link = await C.shareLink(S); openModal('Partager', `<p class="muted" style="margin-top:0">Le lien contient tout le projet. La personne qui l’ouvre en reçoit une copie.</p><textarea readonly style="width:100%;height:110px;font:12px monospace">${esc(link)}</textarea><div class="row"><button class="pri" id="cp">Copier</button></div>`); document.getElementById('cp').onclick = async () => toast(await C.copyText(link) ? 'Lien copié' : 'Sélectionne le texte'); }
  catch { toast('Partage par lien indisponible : utilise Ctrl+S.'); }
}
function exportSVG() {
  const str = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${svg.getAttribute('viewBox')}" width="${svg.clientWidth}" height="${svg.clientHeight}"><style>.ns{vector-effect:non-scaling-stroke}.g{stroke:#eceef1}.gM{stroke:#d3d8df}.dimt{font-weight:600;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fff}</style><rect x="-1e4" y="-1e4" width="2e4" height="2e4" fill="#fff"/>${G.innerHTML}</svg>`;
  download(new Blob([str], { type: 'image/svg+xml' }), slug(S.name) + '-' + view + '.svg');
}
document.getElementById('projMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-cmd]'); if (!b) return; document.getElementById('projMenu').classList.remove('open');
  ({ save: saveFile, devis: openDevis, csv: exportCSV, share, versions: openVersions, snapshot: () => { const n = prompt('Nom du point de sauvegarde :', 'Avant modification'); if (n !== null) { backup(n || 'Point de sauvegarde', false); toast('📌 Point de sauvegarde créé'); } }, shot, svg: exportSVG })[b.dataset.cmd]?.();
});
document.getElementById('fImport').onchange = async e => { const f = e.target.files[0]; if (!f) return; e.target.value = ''; try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.members)) throw 0; backup('Avant import', false); S = migrate(d); sel = []; commit(); fit(); setView3('persp'); } catch { toast('Fichier non reconnu'); } };
document.getElementById('bUndo').onclick = undo; document.getElementById('bRedo').onclick = redo;
document.getElementById('bHelp').onclick = () => openModal('Aide', `<table><tbody>
  <tr><td><kbd>T</kbd> <kbd>F</kbd> <kbd>L</kbd></td><td>Vues dessus / face / côté</td></tr><tr><td><kbd>V</kbd> <kbd>B</kbd> <kbd>P</kbd> <kbd>N</kbd> <kbd>C</kbd></td><td>Sélection, Barre, Poteau, Panneau, Coter</td></tr>
  <tr><td>Maj + clic</td><td>Sélection multiple · barre bien droite</td></tr><tr><td>Flèches · Maj · Alt</td><td>Déplacer de 1 cm · 10 cm · 1 mm dans la vue</td></tr>
  <tr><td><kbd>Ctrl+D</kbd> · <kbd>Suppr</kbd></td><td>Dupliquer · supprimer</td></tr><tr><td><kbd>Ctrl+Z</kbd> / <kbd>Ctrl+Y</kbd> · <kbd>Ctrl+S</kbd></td><td>Annuler / rétablir · enregistrer un fichier</td></tr>
  <tr><td>Clic sur une cote soulignée</td><td>Taper la longueur exacte</td></tr><tr><td><kbd>0</kbd> · <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Tout voir · disposition 2D / 2D+3D / 3D</td></tr></tbody></table>
  <p class="muted">Le métré et le devis sont des estimations pour préparer un chiffrage : vérifie les sections et les assemblages selon les règles de l’art (DTU, Eurocodes) ou avec un bureau d’études.</p>`);
function setLayout(l) { prefs.layout = l; savePrefs(); document.body.className = 'layout-' + l; document.querySelectorAll('[data-layout]').forEach(b => b.classList.toggle('on', b.dataset.layout === l)); setTimeout(() => { resize3D(); render2D(); }, 30); }
document.querySelectorAll('[data-layout]').forEach(b => b.onclick = () => setLayout(b.dataset.layout));
function splitter(id, fn) { const el = document.getElementById(id); el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); const mv = ev => { fn(ev); applySizes(); resize3D(); render2D(); }; const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); savePrefs(); }; el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); }); }
function applySizes() { document.documentElement.style.setProperty('--aside', prefs.aside + 'px'); document.documentElement.style.setProperty('--v3h', prefs.v3h + '%'); }
splitter('hsplit', ev => { prefs.aside = clamp(innerWidth - ev.clientX, 320, innerWidth - 360); });
splitter('vsplit', ev => { const r = document.querySelector('aside').getBoundingClientRect(); prefs.v3h = clamp((ev.clientY - r.top) / r.height * 100, 15, 85); });
const pn = document.getElementById('projName'); pn.value = S.name;
pn.addEventListener('change', () => { S.name = pn.value.trim() || 'Projet'; document.title = S.name + ' · Moovo 3D'; commit(); }); pn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') pn.blur(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 's') { e.preventDefault(); saveFile(); return; }
  if (e.target.closest('input,select,textarea')) return;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); if (sel.length) act('dup'); return; }
  if (mod) return;
  if (k === 'escape') { if (!document.getElementById('modal').hidden) closeModal(); else if (draw) draw = null; else if (tool !== 'select') setTool('select'); else { sel = []; renderAll(); } render2D(); return; }
  if (k === 'delete' || k === 'backspace') { if (sel.length) { e.preventDefault(); act('del'); } return; }
  const tk = { v: 'select', b: 'beam', p: 'post', n: 'panel', c: 'dim' }[k]; if (tk) return setTool(tk);
  const vk = { t: 'top', f: 'front', l: 'side' }[k]; if (vk) return setView(vk);
  if (k === '0') { fit(); render2D(); return; }
  if (k === '1' || k === '2' || k === '3') return setLayout({ 1: '2d', 2: 'split', 3: '3d' }[k]);
  if (k === '?') return document.getElementById('bHelp').click();
  const st = e.shiftKey ? .1 : e.altKey ? .001 : .01, mv = { arrowleft: [-st, 0], arrowright: [st, 0], arrowup: [0, -st], arrowdown: [0, st] }[k];
  if (mv && sel.length) { e.preventDefault(); const V = VIEWS[view], d = add(mul(V.u[0], mv[0]), mul(V.u[1], mv[1])); for (const s of sel) { const o = find(s); if (o.a) { o.a = add(o.a, d).map(r3); o.b = add(o.b, d).map(r3); } else if (o.p0) o.p0 = add(o.p0, d).map(r3); else { o.x = r3(o.x + d[0]); o.y = r3(o.y + d[1]); o.z = r3((o.z || 0) + d[2]); } } commit(); }
});

// =====================================================================
//  Boucle
// =====================================================================
function renderAll() { render2D(); renderPanel(); dirty3D = true; document.getElementById('bUndo').disabled = !past.length; document.getElementById('bRedo').disabled = !future.length; }
function loop() { if (dirty3D) { build3D(); dirty3D = false; } ctl.update(); renderer.render(scene, cam); labelR.render(scene, cam); requestAnimationFrame(loop); }
document.title = S.name + ' · Moovo 3D';
applySizes(); setLayout(prefs.layout); setTool('select'); save(); backup('Ouverture du projet');
document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
document.getElementById('wpLbl').textContent = VIEWS[view].h; syncWp();
requestAnimationFrame(() => { fit(); renderAll(); resize3D(); setView3('persp'); loop(); });
</script>
