<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moovo 3D · Intérieur</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#2563eb">
<style>
  :root{
    --bg:#eef0f3;--panel:#fff;--panel2:#f7f8fa;--ink:#1b1f27;--muted:#697386;--line:#e1e5eb;--line2:#cfd5de;
    --accent:#2563eb;--accent-ink:#fff;--accent-weak:#e9f0ff;--danger:#b42318;--warn:#9a5b00;--warn-bg:#fff6e5;--ok:#15803d;
    --aside:460px;--v3h:46%;--shadow:0 8px 30px #0f172a1f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
  .brand{font-size:15px;display:flex;gap:6px;align-items:center;color:var(--accent)}
  .brand b{color:var(--ink)}
  .projname{font:inherit;font-weight:600;font-size:14px;border:1px solid transparent;border-radius:7px;padding:4px 8px;background:transparent;color:var(--ink);width:220px}
  .projname:hover{border-color:var(--line)} .projname:focus{outline:none;border-color:var(--accent);background:#fff}
  .savestate{font-size:12px;color:var(--muted);white-space:nowrap}
  .savestate.dirty{color:var(--warn)} .savestate.ok{color:var(--ok)}
  .spacer{flex:1}
  .seg{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
  button,.btn,select.tb{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;line-height:1.25}
  button:hover,.btn:hover{border-color:var(--line2);background:#fbfcfd}
  button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:#1d4ed8}
  button.ghost{border-color:transparent;background:transparent}
  button.ghost:hover{background:#f1f3f6}
  button.danger{color:var(--danger)}
  button:disabled{opacity:.4;cursor:default}
  hr{border:0;border-top:1px solid var(--line);margin:6px 0}
  /* menus déroulants */
  .menuwrap{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:50}
  .menu.open{display:block}
  .menu>button,.menu .mi{display:flex;justify-content:space-between;gap:16px;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
  .menu>button:hover,.menu .mi:hover{background:#f1f4f9}
  .menu kbd{margin-left:auto}
  .menu.right{left:auto;right:0}
  /* mise en page */
  main{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--aside);min-height:0}
  body.layout-plan #view3d,body.layout-plan #vsplit{display:none}
  body.layout-3d main{grid-template-columns:1fr}
  body.layout-3d #planWrap,body.layout-3d #hsplit{display:none}
  body.layout-3d aside{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto 1fr}
  body.layout-3d #view3d{grid-row:1/3;grid-column:1;height:auto}
  body.layout-3d #vsplit{display:none}
  body.layout-3d .tabs{grid-column:2;border-left:1px solid var(--line)}
  body.layout-3d #panel{grid-column:2;border-left:1px solid var(--line)}
  .splitter{background:var(--line);cursor:col-resize;position:relative}
  .splitter:hover,.splitter.drag{background:var(--accent)}
  .splitter.h{cursor:row-resize;height:5px;flex:none}
  #planWrap{display:flex;flex-direction:column;min-height:0;min-width:0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #tools button{display:flex;gap:5px;align-items:center}
  #tools button .ic{font-size:14px;line-height:1}
  #planBox{position:relative;flex:1;min-height:0}
  #plan{position:absolute;inset:0;width:100%;height:100%;background:#fafbfc;touch-action:none;user-select:none;display:block}
  #dimEdit{position:absolute;z-index:5;width:120px;font:600 14px ui-monospace,Consolas,monospace;padding:5px 8px;border:2px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);text-align:center;display:none}
  #zoomPct{min-width:52px;text-align:center;font-size:12px;color:var(--muted)}
  .foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:5px 12px;font-size:12px;color:var(--muted);background:var(--panel);border-top:1px solid var(--line)}
  .foot #hint{flex:1;min-width:200px}
  .foot label{display:flex;gap:5px;align-items:center;cursor:pointer;white-space:nowrap}
  .foot select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:#fff}
  #coords{min-width:150px;text-align:right}
  aside{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  #view3d{position:relative;height:var(--v3h);min-height:160px;background:#eef0f3;overflow:hidden;flex:none}
  #view3d.full{position:fixed;inset:46px 0 0 0;height:auto;z-index:25}
  #view3d canvas{display:block}
  .v3bar{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:3}
  .v3bar>*{pointer-events:auto}
  .v3bar button{background:#ffffffeb}
  .v3bar button.on{background:var(--accent)}
  .v3menu{width:310px;max-height:70vh;overflow:auto;padding:10px 12px}
  .v3menu h5{margin:10px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .v3menu h5:first-child{margin-top:2px}
  .v3menu label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
  .v3menu label.col{flex-direction:column;align-items:stretch;gap:3px}
  .v3menu select,.v3menu input[type=number]{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff}
  .v3menu input[type=range]{width:100%}
  .v3menu .two{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  #walkHint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#1d2129e0;color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;display:none;white-space:nowrap;z-index:3}
  .lbl3{font-size:12px;font-weight:600;background:#ffffffd9;padding:2px 7px;border-radius:6px;text-align:center;line-height:1.25;pointer-events:none;white-space:nowrap}
  .lbl3 span{display:block;font-weight:400;font-size:11px;color:#555}
  .tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabs button{flex:1;border:0;border-radius:0;border-bottom:2px solid transparent;padding:9px 4px;background:transparent}
  .tabs button.on{background:none;color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  #panel{flex:1;overflow:auto;padding:14px 16px 28px;min-height:0}
  #panel h3{margin:0 0 2px;font-size:15px}
  #panel h4{margin:18px 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .muted{color:var(--muted);font-size:12.5px}
  .warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d9a4;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:10px}
  .note{margin-top:10px;padding:8px 10px;background:#f6f8fb;border-radius:8px;font-size:12.5px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:10px}
  .f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
  .f.full{grid-column:1/-1}
  .f input,.f select{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;background:#fff}
  .f input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #2563eb22}
  .f input[type=number]{font-family:ui-monospace,Consolas,monospace}
  .f input[type=color]{padding:2px;height:34px}
  .chk{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:13px;cursor:pointer}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .swatches button{width:22px;height:22px;padding:0;border-radius:6px;border:1px solid #0002}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .tile b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .tile span{font-size:12px;color:var(--muted)}
  .tile.total{grid-column:1/-1;background:var(--accent-weak);border-color:#c9d8fb}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:500;color:var(--muted);font-size:11.5px}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.c,th.c{text-align:center}
  td input[type=number]{width:62px;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 5px;text-align:right}
  tfoot td{font-weight:600;border-bottom:0}
  tr.clickable{cursor:pointer} tr.clickable:hover td{background:#f6f8fb}
  kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff;color:var(--muted)}
  /* catalogue */
  .catalog{width:380px;padding:10px}
  .catalog input{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:8px}
  #catList{max-height:62vh;overflow:auto}
  #catList h6{margin:10px 2px 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  #catList .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  #catList button{display:flex;gap:8px;align-items:center;text-align:left;white-space:normal;padding:6px 8px;font-size:12.5px}
  #catList .chip{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid #0002}
  /* modale */
  .modal{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 16px}
  .modal[hidden]{display:none}
  .mbox{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
  #mBody{padding:14px 16px 18px;overflow:auto}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1b1f27;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* SVG */
  .g{stroke:#eceef1;stroke-width:1;vector-effect:non-scaling-stroke}
  .gM{stroke:#d6dbe1;stroke-width:1;vector-effect:non-scaling-stroke}
  .ns{vector-effect:non-scaling-stroke}
  .wall{cursor:grab}
  .wall:hover{filter:brightness(1.25)}
  .item{cursor:move}
  .op{cursor:ew-resize}
  .t2{fill:#1f2937;paint-order:stroke;stroke:#ffffffd0;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .dimt{fill:var(--accent);font-weight:600;paint-order:stroke;stroke:#fafbfc;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .edim{cursor:text}
  .edim .dimt{pointer-events:auto;text-decoration:underline dotted}
  .edim:hover .dimt{fill:#111827}
  @media (max-width:980px){
    body{height:auto;overflow:auto;display:block}
    main{display:block}
    #planBox{height:64vh;flex:none}
    #hsplit,#vsplit{display:none}
    #view3d{height:50vh}
    #panel{overflow:visible}
    .projname{width:140px}
  }
</style>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<body class="layout-split">
<header>
  <a class="brand" href="index.html" title="Retour à mes projets" style="text-decoration:none">⌂ <b>Moovo 3D</b></a>
  <input id="projName" class="projname" spellcheck="false" title="Nom du projet (cliquer pour renommer)">
  <span id="saveState" class="savestate"></span>
  <div class="menuwrap">
    <button id="bProj" class="ghost">Projet ▾</button>
    <div class="menu" id="projMenu">
      <button data-cmd="save">💾 Enregistrer dans un fichier <kbd>Ctrl+S</kbd></button>
      <button data-cmd="saveAs">Enregistrer sous…</button>
      <button data-cmd="open">📂 Ouvrir un fichier… <kbd>Ctrl+O</kbd></button>
      <hr>
      <button data-cmd="devis">📄 Générer le devis…</button>
      <button data-cmd="share">🔗 Partager par lien…</button>
      <button data-cmd="baseline">🏁 Définir l’état actuel comme « existant »</button>
      <hr>
      <button data-cmd="versions">🕘 Versions &amp; sauvegardes automatiques…</button>
      <button data-cmd="snapshot">📌 Créer un point de sauvegarde</button>
      <hr>
      <button data-cmd="exportSvg">🖨 Exporter le plan coté (SVG)</button>
      <button data-cmd="exportPng">🖼 Exporter le plan coté (PNG)</button>
      <button data-cmd="shot3d">📷 Capture de la vue 3D (PNG)</button>
      <button id="bExport" data-cmd="exportJson">Exporter les données (.json)</button>
      <label class="mi">Importer des données (.json)<input type="file" id="fImport" accept=".json,application/json" hidden></label>
      <hr>
      <button id="bReset" class="danger">Repartir du plan d’origine…</button>
    </div>
  </div>
  <div class="seg"><button id="bUndo" class="ghost" title="Annuler (Ctrl+Z)">↶</button><button id="bRedo" class="ghost" title="Rétablir (Ctrl+Y)">↷</button></div>
  <div class="spacer"></div>
  <div class="seg" id="layoutSeg"><button data-layout="plan">Plan</button><button data-layout="split" class="on">Plan + 3D</button><button data-layout="3d">3D</button></div>
  <button id="bSettings" class="ghost" title="Réglages">⚙ Réglages</button>
  <button id="bHelp" class="ghost" title="Aide et raccourcis (?)">?</button>
</header>
<main>
  <section id="planWrap">
    <div class="toolbar">
      <div class="seg" id="tools">
        <button data-tool="select" title="Sélection (V)"><span class="ic">↖</span>Sélection</button>
        <button data-tool="wall" title="Mur (M)"><span class="ic">▭</span>Mur</button>
        <button data-tool="door" title="Porte (P)"><span class="ic">⌒</span>Porte</button>
        <button data-tool="window" title="Fenêtre (F)"><span class="ic">▤</span>Fenêtre</button>
        <button data-tool="baie" title="Baie / porte-fenêtre">Baie</button>
        <button data-tool="opening" title="Passage sans porte">Passage</button>
        <button data-tool="placard" title="Placard">Placard</button>
        <button data-tool="dim" title="Poser une cote (C)"><span class="ic">↔</span>Coter</button>
        <button data-tool="measure" title="Mesure temporaire (D)"><span class="ic">📏</span>Mesurer</button>
      </div>
      <div class="menuwrap">
        <button id="bCatalog" class="primary" title="Ajouter un objet (A)">＋ Ajouter</button>
        <div class="menu catalog" id="catalog"><input id="catSearch" placeholder="Rechercher un objet… (prise, lit, spot…)"><div id="catList"></div></div>
      </div>
      <select id="addItem" hidden></select>
      <div class="spacer"></div>
      <div class="seg"><button id="zOut" title="Dézoomer">−</button><span id="zoomPct">100 %</span><button id="zIn" title="Zoomer">+</button><button id="zFit" title="Tout voir (0)">Ajuster</button></div>
    </div>
    <div id="planBox"><svg id="plan" xmlns="http://www.w3.org/2000/svg"><g id="G"></g></svg><input id="dimEdit" autocomplete="off"></div>
    <div class="foot">
      <span id="hint"></span>
      <label title="Cotes automatiques des pièces"><input type="checkbox" id="lDims" checked> Cotes</label>
      <label title="Volumes de salle de bain, hauteurs"><input type="checkbox" id="lElec"> Électricité</label>
      <label><input type="checkbox" id="lFurn2" checked> Mobilier</label>
      <label title="S’aimanter aux murs et objets"><input type="checkbox" id="lMagnet" checked> Aimant</label>
      <label>Pas <select id="snap"><option value="0.001">1 mm</option><option value="0.005">5 mm</option><option value="0.01" selected>1 cm</option><option value="0.05">5 cm</option><option value="0.1">10 cm</option></select></label>
      <label>Unité <select id="unitSel"><option value="cm">cm</option><option value="mm">mm</option></select></label>
      <span id="coords" class="mono"></span>
    </div>
  </section>
  <div id="hsplit" class="splitter" title="Glisser pour redimensionner"></div>
  <aside>
    <div id="view3d">
      <div class="v3bar">
        <div class="seg"><button data-v="persp" class="on">3D</button><button data-v="top">Dessus</button><button data-v="walk">Visite</button></div>
        <div class="seg">
          <button id="bFrame" title="Cadrer la sélection (ou tout)">Cadrer</button>
          <button id="bShot" title="Capture PNG">📷</button>
          <div class="menuwrap">
            <button id="bV3opt">Affichage ▾</button>
            <div class="menu right v3menu" id="v3menu">
              <h5>Portes &amp; fenêtres</h5>
              <label class="col">Portes <select id="oDoorMode"><option value="open">Ouvertes</option><option value="closed">Fermées</option><option value="hidden">Masquées (voir les volumes)</option></select></label>
              <label><input type="checkbox" id="oGlass" checked> Vitrages des fenêtres</label>
              <h5>Murs</h5>
              <label class="col">Hauteur <select id="oWallMode"><option value="full">Pleine hauteur</option><option value="cut">Coupés (maquette)</option><option value="xray">Transparents</option></select></label>
              <label class="col">Hauteur de coupe : <b id="oCutHv"></b><input type="range" id="oCutH" min="0.2" max="2.5" step="0.05" value="1.1"></label>
              <label class="col">Transparence : <b id="oWallOpv"></b><input type="range" id="oWallOp" min="0.1" max="0.9" step="0.05" value="0.35"></label>
              <h5>Éléments affichés</h5>
              <div class="two">
                <label><input type="checkbox" id="oFurn" checked> Mobilier</label>
                <label><input type="checkbox" id="oElec" checked> Électricité</label>
                <label><input type="checkbox" id="oCeil" checked> Faux plafonds</label>
                <label><input type="checkbox" id="oRoof"> Plafonds</label>
                <label><input type="checkbox" id="oFinish" checked> Faïence, peintures</label>
                <label><input type="checkbox" id="oTex" checked> Textures de sol</label>
                <label><input type="checkbox" id="oLbl" checked> Noms des pièces</label>
                <label><input type="checkbox" id="oShadow" checked> Ombres</label>
              </div>
              <label><input type="checkbox" id="oIsolate"> Isoler la pièce sélectionnée</label>
              <h5>Ambiance</h5>
              <label><input type="checkbox" id="oNight"> Lumières allumées (nuit)</label>
              <label class="col">Orientation du soleil : <b id="oSunv"></b><input type="range" id="oSun" min="0" max="360" step="5" value="40"></label>
              <h5>Visite</h5>
              <div class="two">
                <label class="col">Hauteur des yeux (cm) <input type="number" id="oEye" min="80" max="200" step="1" value="160"></label>
                <label class="col">Vitesse <select id="oSpeed"><option value="1">Lente</option><option value="1.8" selected>Normale</option><option value="3">Rapide</option></select></label>
              </div>
              <label><input type="checkbox" id="oCollide" checked> Ne pas traverser les murs</label>
            </div>
          </div>
          <button id="bFull" title="Plein écran">⤢</button>
        </div>
      </div>
      <div id="walkHint">Glisser pour regarder · ZQSD / flèches pour avancer · Maj pour courir · Échap pour sortir</div>
    </div>
    <div id="vsplit" class="splitter h" title="Glisser pour redimensionner"></div>
    <nav class="tabs"><button data-tab="sel" class="on">Sélection</button><button data-tab="rooms">Pièces</button><button data-tab="elec">Électricité</button><button data-tab="works">Travaux &amp; budget</button></nav>
    <div id="panel"></div>
  </aside>
</main>
<div id="toast"></div>
<div id="modal" class="modal" hidden><div class="mbox"><div class="mhead"><b id="mTitle"></b><button id="mClose" class="ghost">✕</button></div><div id="mBody"></div></div></div>

<script src="moovo-core.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

  return s0;
})();

function roomType(n) {

  if (/chambre|bureau/.test(n)) return 'chambre';
  if (/cuisine/.test(n)) return 'cuisine';
  if (/bain|sdb|douche|sde/.test(n)) return 'sdb';
  if (/wc|toilette/.test(n)) return 'wc';
  if (/entr|couloir|d[ée]gagement|hall/.test(n)) return 'circ';
  if (/buanderie|cellier/.test(n)) return 'buanderie';

    const its = inRoom(r), type = roomType(roomName(r)), a = r.area;
    const n = k => its.filter(i => CAT[i.type].elec === k).length;
    const sockets = n('socket'), work = its.filter(i => CAT[i.type].work).length, lights = n('light'), spec = n('special'), hob = n('hob32'), rj = n('rj45'), sw = n('switch');
    const machines = its.filter(i => i.type === 'washer' || i.type === 'dryer').length;

    if (type === 'chambre') { need('Prises 16 A', sockets, 3); need('Point lumineux', lights, 1); need('RJ45', rj, 1); }
    if (type === 'cuisine') { need('Prises 16 A', sockets, a > 4 ? 6 : 3); if (a > 4) need('…dont au-dessus du plan de travail', work, 4); need('Sortie 32 A plaques', hob, 1); need('Prises spécialisées 20 A', spec, 2 + machines, 'four, lave-vaisselle' + (machines ? ', lave-linge' : '')); need('Point lumineux', lights, 1); }
    if (type === 'sdb') { need('Prise 16 A (hors volumes)', sockets, 1); need('Point lumineux', lights, 1); if (machines) need('Prise spécialisée 20 A', spec, machines, 'lave-linge / sèche-linge'); }
    if (type === 'wc') need('Point lumineux', lights, 1);

    if (type === 'buanderie') { need('Point lumineux', lights, 1); if (machines) need('Prise spécialisée 20 A', spec, machines); }
    if (lights && !sw && type !== 'autre') req.push({ label: 'Interrupteur (conseillé à l’entrée)', have: 0, min: 1, ok: false, soft: true });
    rows.push({ r, type, req });

    if (['socket', 'special', 'rj45'].includes(c.elec) && ax < .05) warns.push({ lvl: 'err', it, t: `${it.name} : axe à ${cmTxt(ax)} ${UNIT()}, minimum 5 cm.` });
    if (c.elec === 'hob32' && ax < .12) warns.push({ lvl: 'err', it, t: `${it.name} : axe à ${cmTxt(ax)} ${UNIT()}, minimum 12 cm.` });
    if (c.elec === 'switch' && (ax < .90 || ax > 1.30)) warns.push({ lvl: 'warn', it, t: `${it.name} : axe à ${cmTxt(ax)} ${UNIT()}, recommandé entre 90 et 130 cm.` });
    if (c.elec === 'panel' && (ax - itemH(it, .75) / 2 < .99 || ax + itemH(it, .75) / 2 > 1.81)) warns.push({ lvl: 'warn', it, t: `Tableau : commandes à placer entre 1,00 et 1,80 m.` });
    for (const w of wet) {
      const g = fp(w), dx = Math.max(g.x - cx, 0, cx - (g.x + g.w)), dy = Math.max(g.y - cy, 0, cy - (g.y + g.h)), dist = Math.hypot(dx, dy);
      if (['socket', 'special', 'switch', 'hob32', 'rj45'].includes(c.elec) && dist < .60 && ax < 2.25)
        warns.push({ lvl: 'err', it, t: `${it.name} à ${cmTxt(dist)} ${UNIT()} de ${w.name.toLowerCase()} : interdit en volumes 1-2 (60 cm). À déplacer hors volume.` });
      if (c.elec === 'light' && dist < .01 && !c.ceil) warns.push({ lvl: 'warn', it, t: `${it.name} au-dessus de ${w.name.toLowerCase()} : luminaire IPX4 classe II minimum (spots TBTS 12 V conseillés).` });
    }

  const title = `<text x="${exportBox.x + .3}" y="${exportBox.y + .45}" font-size="${18 * s9}" font-weight="700" fill="#1b1f27">${esc(S.name)}</text><text x="${exportBox.x + .3}" y="${exportBox.y + .45 + 22 * s9}" font-size="${11 * s9}" fill="#697386">Plan coté · cotes en ${UNIT()} · hauteur sous plafond ${cmTxt(S.H)} ${UNIT()} · ${new Date().toLocaleDateString('fr-FR')}</text>`;
  const out = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W)}" height="${Math.round(Hh)}" viewBox="${exportBox.x} ${exportBox.y} ${exportBox.w} ${exportBox.h}"><style>${css}</style><rect x="${exportBox.x}" y="${exportBox.y}" width="${exportBox.w}" height="${exportBox.h}" fill="#fff"/>${title}${body}</svg>`.replace(/var\(--accent\)/g, '#2563eb');
  exportBox = null; sel = keep.sel; tool = keep.tool; Object.assign(view, keep.view); render2D();
  return { svg: out, W, H: Hh };
}
function exportPlan(fmt) {
  const { svg: str, W, H } = planSVGString();
  if (fmt === 'svg') return download(str, slug(S.name) + '-plan.svg', 'image/svg+xml');
  const img = new Image(), k = 2;
  img.onload = () => { const c = document.createElement('canvas'); c.width = W * k; c.height = H * k; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => download(b, slug(S.name) + '-plan.png')); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}
// --- réglages
function syncPrefsUI() {
  document.getElementById('unitSel').value = prefs.unit; document.getElementById('snap').value = prefs.snap;
  document.getElementById('lMagnet').checked = prefs.magnet;
  for (const [id, k] of [['lDims', 'dims'], ['lElec', 'elec'], ['lFurn2', 'furn']]) { document.getElementById(id).checked = prefs.layers[k]; layer[k] = prefs.layers[k]; }
}
function openSettings() {
  const st = S.settings;
  openModal('settings', 'Réglages', `
    <h4 style="margin-top:0">Projet</h4>
    <div class="grid2">
      ${field('Nom du projet', 'root', 'name', 'text', S.name, 'full')}
      ${field('Hauteur sous plafond (cm)', 'root', 'H', 'cm', S.H)}
      ${field('Épaisseur des nouvelles cloisons (cm)', 'settings', 'defaultT', 'cm', st.defaultT)}
    </div>
    <h4>Précision</h4>
    <div class="grid2">
      ${selectF('Unité d’affichage et de saisie', 'prefs', 'unit', prefs.unit, [['cm', 'Centimètres (au mm près : 72,5)'], ['mm', 'Millimètres (725)']])}
      ${selectF('Pas de déplacement à la souris', 'prefs', 'snap', prefs.snap, [['0.001', '1 mm'], ['0.005', '5 mm'], ['0.01', '1 cm'], ['0.05', '5 cm'], ['0.1', '10 cm']])}
    </div>
    <p class="muted">Clavier : flèches = 1 cm, <kbd>Maj</kbd> + flèches = 10 cm, <kbd>Alt</kbd> + flèches = 1 mm. Clique sur n’importe quelle cote soulignée pour taper sa valeur exacte.</p>
    <h4>Couleurs par défaut</h4>

      ${field('Plafonds', 'settings', 'ceilColor', 'color', st.ceilColor)}
      ${field('Portes', 'settings', 'doorColor', 'color', st.doorColor)}
      ${field('Menuiseries (fenêtres)', 'settings', 'frameColor', 'color', st.frameColor)}
      ${field('Faïence', 'settings', 'tileColor', 'color', st.tileColor)}
    </div>
    <h4>Faïence</h4>
    <div class="grid2">
      ${field('Hauteur générale (cm)', 'settings', 'tileH', 'cm', st.tileH)}
      ${field('Hauteur zone humide (cm)', 'settings', 'wetH', 'cm', st.wetH)}
    </div>`);
}
function openHelp() {
  openModal('help', 'Aide & raccourcis', `
    <table><tbody>
      <tr><td><kbd>V</kbd> <kbd>M</kbd> <kbd>P</kbd> <kbd>F</kbd></td><td>Sélection, Mur, Porte, Fenêtre</td></tr>
      <tr><td><kbd>C</kbd> / <kbd>D</kbd></td><td>Poser une cote / mesure temporaire</td></tr>
      <tr><td><kbd>A</kbd></td><td>Ajouter un objet (catalogue avec recherche)</td></tr>
      <tr><td>Clic sur une cote soulignée</td><td>Taper la valeur exacte (ou +5 / −5) : le mur, l’ouverture ou l’objet bouge</td></tr>
      <tr><td>Flèches · <kbd>Maj</kbd> · <kbd>Alt</kbd></td><td>Déplacer de 1 cm · 10 cm · 1 mm</td></tr>
      <tr><td><kbd>R</kbd></td><td>Pivoter l’objet</td></tr>
      <tr><td><kbd>I</kbd> / <kbd>G</kbd> / double-clic</td><td>Porte : changer le côté / les gonds / les 4 sens</td></tr>
      <tr><td><kbd>Ctrl+D</kbd> · <kbd>Ctrl+C</kbd> / <kbd>Ctrl+V</kbd></td><td>Dupliquer · copier / coller un objet</td></tr>
      <tr><td><kbd>Suppr</kbd></td><td>Supprimer la sélection</td></tr>
      <tr><td><kbd>Ctrl+Z</kbd> / <kbd>Ctrl+Y</kbd></td><td>Annuler / rétablir (200 étapes)</td></tr>
      <tr><td><kbd>Ctrl+S</kbd> / <kbd>Ctrl+O</kbd></td><td>Enregistrer / ouvrir un fichier projet</td></tr>
      <tr><td><kbd>0</kbd></td><td>Tout voir</td></tr>
      <tr><td><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd></td><td>Disposition : plan, plan + 3D, 3D</td></tr>
      <tr><td>Molette · glisser le fond</td><td>Zoomer · se déplacer dans le plan</td></tr>
      <tr><td>Visite 3D</td><td>ZQSD / flèches, <kbd>Maj</kbd> pour courir, glisser pour regarder</td></tr>
    </tbody></table>
    <p class="muted">Tout est enregistré automatiquement dans ce navigateur à chaque modification. Pense à garder aussi un fichier (<kbd>Ctrl+S</kbd>) et à créer des points de sauvegarde avant les grosses modifications.</p>`);
}
// --- menus
const menus = [['bProj', 'projMenu'], ['bCatalog', 'catalog'], ['bV3opt', 'v3menu']];
function closeMenus(except) { for (const [, m] of menus) if (m !== except) document.getElementById(m).classList.remove('open'); }
for (const [b, m] of menus) document.getElementById(b).addEventListener('click', e => { e.stopPropagation(); const el = document.getElementById(m); const open = !el.classList.contains('open'); closeMenus(); el.classList.toggle('open', open); if (open && m === 'catalog') { renderCatalog(); document.getElementById('catSearch').focus(); } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menuwrap')) closeMenus(); });
document.getElementById('projMenu').addEventListener('click', e => {
  const b = e.target.closest('[data-cmd]'); if (!b) return; closeMenus();
  ({ save: () => saveFile(false), saveAs: () => saveFile(true), open: openFile, versions: openVersions,
     snapshot: () => { const n = prompt('Nom du point de sauvegarde :', 'Avant modification'); if (n !== null) { backup(n || 'Point de sauvegarde', false); toast('📌 Point de sauvegarde créé'); } },
     devis: openDevis, share: shareProject, baseline: setBaseline,
     exportSvg: () => exportPlan('svg'), exportPng: () => exportPlan('png'), shot3d: () => shot3D() }[b.dataset.cmd] ?? (() => {}))();
});
document.getElementById('bReset').addEventListener('click', closeMenus);
document.getElementById('bSettings').onclick = openSettings;
document.getElementById('bHelp').onclick = openHelp;
// --- catalogue
function renderCatalog() {
  const q = document.getElementById('catSearch').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const groups = {};
  for (const [k, c] of Object.entries(CAT)) {
    const g = CAT_GROUP(k), hay = (c.label + ' ' + g).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    if (q && !hay.includes(q)) continue;
    (groups[g] ??= []).push(`<button data-add="${k}"><span class="chip" style="background:${c.color ?? '#d9d2c5'}"></span>${c.label}</button>`);
  }
  document.getElementById('catList').innerHTML = Object.entries(groups).map(([g, b]) => `<h6>${g}</h6><div class="cgrid">${b.join('')}</div>`).join('') || '<p class="muted">Aucun objet trouvé.</p>';
}
document.getElementById('catSearch').addEventListener('input', renderCatalog);
document.getElementById('catSearch').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') document.querySelector('#catList [data-add]')?.click(); if (e.key === 'Escape') closeMenus(); });
document.getElementById('catList').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (!b) return; closeMenus(); startAdd(b.dataset.add); });
// --- disposition & séparateurs redimensionnables
function setLayout(l) {
  prefs.layout = l; savePrefs();
  document.body.classList.remove('layout-plan', 'layout-split', 'layout-3d'); document.body.classList.add('layout-' + l);
  document.querySelectorAll('[data-layout]').forEach(b => b.classList.toggle('on', b.dataset.layout === l));
  setTimeout(() => { resize3D(); schedule(false); }, 30);
}
document.querySelectorAll('[data-layout]').forEach(b => b.onclick = () => setLayout(b.dataset.layout));
function applySizes() { document.documentElement.style.setProperty('--aside', prefs.aside + 'px'); document.documentElement.style.setProperty('--v3h', prefs.v3h + '%'); }
function splitter(id, onMove) {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.classList.add('drag'); el.setPointerCapture(e.pointerId);
    const mv = ev => { onMove(ev); applySizes(); resize3D(); schedule(false); };
    const up = () => { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); savePrefs(); };
    el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
  });
}
splitter('hsplit', ev => { prefs.aside = clamp(innerWidth - ev.clientX, 300, innerWidth - 360); });
splitter('vsplit', ev => { const r = document.querySelector('aside').getBoundingClientRect(); prefs.v3h = clamp((ev.clientY - r.top) / r.height * 100, 15, 85); });
// --- pied de page : unité, pas, aimant, calques
document.getElementById('unitSel').onchange = e => { prefs.unit = e.target.value; savePrefs(); renderAll(); };
document.getElementById('snap').onchange = e => { prefs.snap = e.target.value; savePrefs(); };
document.getElementById('lMagnet').onchange = e => { prefs.magnet = e.target.checked; savePrefs(); };
for (const [id, k] of [['lDims', 'dims'], ['lElec', 'elec'], ['lFurn2', 'furn']]) document.getElementById(id).addEventListener('change', e => { prefs.layers[k] = e.target.checked; savePrefs(); });
// --- nom du projet
const pn = document.getElementById('projName');
pn.addEventListener('change', () => { S.name = pn.value.trim() || 'Appartement'; pn.value = S.name; document.title = S.name + ' · Atelier'; commit(); });
pn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') pn.blur(); });
// --- raccourcis globaux
let clip = null;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 's') { e.preventDefault(); saveFile(e.shiftKey); return; }
  if (mod && k === 'o') { e.preventDefault(); openFile(); return; }
  if (e.target.closest('input,select,textarea')) return;
  if (k === 'escape' && !document.getElementById('modal').hidden) { closeModal(); return; }
  if (mod && k === 'c' && sel?.kind === 'item') { clip = JSON.stringify(resolveSel()); toast('Objet copié'); return; }
  if (mod && k === 'v' && clip) { const it = { ...JSON.parse(clip), id: uid() }; it.x = r2(view.cx - fp(it).w / 2); it.y = r2(view.cy - fp(it).h / 2); S.items.push(it); sel = { kind: 'item', id: it.id }; commit(); return; }
  if (mod) return;
  if (k === 'a') { e.preventDefault(); document.getElementById('bCatalog').click(); }
  else if (k === '0') { fit(); schedule(false); }
  else if (k === '?') openHelp();
  else if (k === '1' || k === '2' || k === '3') setLayout({ 1: 'plan', 2: 'split', 3: '3d' }[k]);
}, true);
// --- état initial de l'interface
pn.value = S.name; document.title = S.name + ' · Atelier';
applySizes(); syncPrefsUI(); setLayout(prefs.layout);
lastSaveAt = new Date(); fileDirty = true; updateSaveState();
backup('Ouverture du projet');

setTool('select');
renderAll();
requestAnimationFrame(() => { fit(); render2D(); resize3D(); setView('persp'); loop(); });
</script>
